{
  "extensions": [
    "akka.cluster.pubsub.DistributedPubSub",
    "akka.cluster.client.ClusterClientReceptionist",
    "akka.cluster.ddata.DistributedData",
    "akka.cluster.metrics.ClusterMetricsExtension"
  ],
  "loglevel": "INFO",
  "loggers": ["akka.event.slf4j.Slf4jLogger"],
  "log-dead-letters": "off",
  "log-dead-letters-during-shutdown": "off",
  "actor": {
    "allow-java-serialization": "off",
    "provider": "cluster",
    "default-dispatcher": {
      "type": "Dispatcher",
      "executor": "fork-join-executor",
      "fork-join-executor": {
        "parallelism-min": 2,
        "parallelism-factor": 2.0,
        "parallelism-max": 10
      },
      "throughput": 100
    },
    "serializers": {
      "java": "akka.serialization.JavaSerializer",
      "proto": "akka.remote.serialization.ProtobufSerializer"
    },
    "serialization-bindings": {
      "java.lang.String": "java",
      "com.google.protobuf.GeneratedMessageV3": "proto",
      "akka.cluster.sharding.ShardRegion$GetClusterShardingStats": "akka-sharding",
      "akka.cluster.sharding.ShardRegion$ClusterShardingStats": "akka-sharding"
    },
    "mailbox": {
      "small-bounded": {
        "mailbox-type": "akka.dispatch.BoundedDequeBasedMailbox",
        "mailbox-capacity": 50000,
        "stash-capacity": 20000,
        "mailbox-push-timeout-time": 0
      },
      "large-bounded": {
        "mailbox-type": "akka.dispatch.BoundedDequeBasedMailbox",
        "mailbox-capacity": 10000000,
        "stash-capacity": 100000,
        "mailbox-push-timeout-time": 0
      },
      "unbounded-normal-mailbox": {
        "mailbox-type": "akka.dispatch.SingleConsumerOnlyUnboundedMailbox"
      },
      "fast-unded": {
        "mailbox-type": "akka.dispatch.NonBlockingBoundedMailbox",
        "mailbox-capacity": 100000
      }
    }
  },
  "remote": {
    "artery": {
      "enabled": "on",
      "transport": "tcp",
      "advanced": {
        "maximum-frame-size": "2048k"
      }
    },
    "initial-system-message-delivery-timeout": "120m",
    "log-remote-lifecycle-events": "on",
    "system-message-buffer-size": 100000,
    "transport-failure-detector": {
      "heartbeat-interval": "4s",
      "acceptable-heartbeat-pause": "16s"
    },
    "watch-failure-detector": {
      "heartbeat-interval": "5s",
      "threshold": 15.0,
      "max-sample-size": 200,
      "min-std-deviation": "200ms",
      "acceptable-heartbeat-pause": "60s",
      "unreachable-nodes-reaper-interval": "1s",
      "expected-response-after": "1s"
    }
  },
  "discovery": {
    "method": "kubernetes-api"
  },
  "cluster": {
    "app-version": "3.5.0",
    "seed-nodes": [],
    "downing-provider-class": "akka.cluster.sbr.SplitBrainResolverProvider",
    "failure-detector": {
      "implementation-class": "akka.remote.PhiAccrualFailureDetector",
      "heartbeat-interval": "3s",
      "threshold": 15.0,
      "max-sample-size": 1000,
      "min-std-deviation": "200ms",
      "acceptable-heartbeat-pause": "30s",
      "monitored-by-nr-of-members": 5,
      "expected-response-after": "1s"
    },
    "sharding": {
      "passivation": {
        "strategy": "off"
      },
      "rebalance-interval": "180s",
      "state-store-mode": "ddata",
      "handoff-timeout": "180s"
    },
    "use-dispatcher": "akka.cluster.cluster-dispatcher",
    "cluster-dispatcher": {
      "type": "Dispatcher",
      "executor": "fork-join-executor",
      "fork-join-executor": {
        "parallelism-min": 2,
        "parallelism-max": 4
      }
    },
    "coordinated-shutdown": {
      "default-phase-timeout": "30s",
      "phases": {
        "before-cluster-sharding-shutdown-region": {
          "timeout": "60s",
          "depends-on": ["before-cluster-shutdown"]
        },
        "cluster-sharding-shutdown-region": {
          "timeout": "1800s",
          "depends-on": ["before-cluster-sharding-shutdown-region"]
        },
        "cluster-exiting": {
          "timeout": "30s"
        }
      }
    }
  }
}